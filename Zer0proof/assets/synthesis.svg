<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 800" role="img" aria-labelledby="title desc">
  <title id="title">Public C5 verification, public S-Machine and TI contracts, and the actuality bridge</title>
  <desc id="desc">The public C5 GroundingChain supplies a kernel term for the strong modal Omega conclusion from the complete C5 context. The public S-Machine contract separately certifies non-modal termination and a unique terminal state. The public TI contract certifies finite convergence to a unique fixed top under explicit requirements. Neither contract supplies a modal or identity bridge to C5 Omega. Applying the public C5 theorem to reality additionally requires the philosophical claim that reality satisfies every C5 premise.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path class="arrowhead" d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      .background { fill:none; }
      .public { fill:#ecfdf5; stroke:#047857; stroke-width:2; }
      .concept { fill:#fff7ed; stroke:#c2410c; stroke-width:2; }
      .unknown { fill:#f8fafc; stroke:#64748b; stroke-width:2; }
      .actuality { fill:#eef2ff; stroke:#4338ca; stroke-width:2; }
      .result { fill:#f0fdf4; stroke:#15803d; stroke-width:2.5; }
      .flow { fill:none; stroke:#64748b; stroke-width:2.5; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#94a3b8; stroke-width:2; stroke-dasharray:7 6; }
      .heading { fill:#64748b; font:700 21px system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; }
      .label { fill:#111827; font:700 17px system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; }
      .detail { fill:#64748b; font:14px system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; }
      .formula { fill:#111827; font:italic 18px Georgia,"Times New Roman",serif; text-anchor:middle; }
      .status { fill:#64748b; font:600 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; }
      @media (prefers-color-scheme: dark) {
        .background { fill:none; }
        .public { fill:#102a24; stroke:#6ee7b7; }
        .concept { fill:#32190c; stroke:#fdba74; }
        .unknown { fill:#161b22; stroke:#8c959f; }
        .actuality { fill:#1f2245; stroke:#a5b4fc; }
        .result { fill:#102a24; stroke:#86efac; }
        .flow { stroke:#b1bac4; }
        .dash { stroke:#8c959f; }
        .arrowhead { fill:#b1bac4; }
        .heading, .label, .formula { fill:#f0f6fc; }
        .detail, .status { fill:#b1bac4; }
      }
    </style>
  </defs>

  <rect class="background" width="980" height="800"/>
  <text class="heading" x="490" y="42">ROUTES AND CERTIFICATION STATUS</text>

  <rect class="public" x="35" y="75" width="420" height="160" rx="8"/>
  <text class="label" x="245" y="108">PUBLIC C5 / GroundingChain</text>
  <text class="formula" x="245" y="142">C1 + GroundObtains + C3 + C4a + I(w₀)</text>
  <text class="detail" x="245" y="174">C4a.identity + explicit unique and rigid premises</text>
  <text class="status" x="245" y="205">SOURCE-REPRODUCIBLE · KERNEL-VERIFIED</text>

  <rect class="concept" x="485" y="75" width="220" height="160" rx="8"/>
  <text class="label" x="595" y="108">S-MACHINE CONTRACT</text>
  <text class="detail" x="595" y="141">Public certificate bundle</text>
  <text class="detail" x="595" y="166">Termination + unique terminal</text>
  <text class="status" x="595" y="205">FORMAL CONTRACT · KERNEL-VERIFIED</text>

  <rect class="unknown" x="735" y="75" width="210" height="160" rx="8"/>
  <text class="label" x="840" y="108">TI</text>
  <text class="detail" x="840" y="141">Public abstract contract</text>
  <text class="detail" x="840" y="166">Finite convergence + unique top</text>
  <text class="status" x="840" y="205">FORMAL CONTRACT · KERNEL-VERIFIED</text>

  <path class="flow" d="M245 235 V295"/>
  <path class="dash" d="M595 235 V286"/>
  <path class="dash" d="M595 310 V322" marker-end="url(#arrow)"/>
  <path class="dash" d="M840 235 V286"/>
  <path class="dash" d="M840 310 V322" marker-end="url(#arrow)"/>
  <text class="detail" x="595" y="302">operational realizability</text>
  <text class="detail" x="840" y="302">abstract TI realizability</text>

  <rect class="public" x="35" y="325" width="420" height="160" rx="8"/>
  <text class="label" x="245" y="362">PUBLIC FORMAL RESULT</text>
  <text class="formula" x="245" y="406">ΓC5 ⊢ φ  →  public t : φ</text>
  <text class="detail" x="245" y="443">φ = □w₀∃!x Ω(x), plus the</text>
  <text class="detail" x="245" y="467">rigid-witness theorem</text>

  <rect class="actuality" x="525" y="325" width="420" height="160" rx="8"/>
  <text class="label" x="735" y="362">PHILOSOPHICAL ACTUALITY BRIDGE</text>
  <text class="formula" x="735" y="406">ℛ ⊨ ΓC5</text>
  <text class="detail" x="735" y="443">Must justify every C5 premise;</text>
  <text class="detail" x="735" y="467">I(w₀) alone is insufficient</text>

  <path class="flow" d="M245 485 V615"/>
  <path class="flow" d="M735 485 V615"/>

  <rect class="result" x="120" y="635" width="740" height="105" rx="8"/>
  <text class="label" x="490" y="671">APPLICATION TO ACTUALITY</text>
  <text class="formula" x="490" y="705">God is necessarily and uniquely the Absolute Ground</text>
  <text class="status" x="490" y="729">FORMAL DERIVATION + PHILOSOPHICAL INTERPRETATION</text>
</svg>
